[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-customer-support-agent"
version = "0.0.0"
description = "Evaluation-first scaffold for a grounded customer support agent"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
exclude = ["configs/*.json", "configs/profiling.yaml"]
