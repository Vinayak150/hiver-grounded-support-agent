{
  "version": "dev-llm-judge-v1",
  "provider": "openai",
  "model": "gpt-4.1-mini",
  "temperature": 0.0,
  "timeout_seconds": 60,
  "max_retries": 2,
  "rubric_version": "support-response-rubric-v1",
  "prompt_version": "blinded-absolute-v1",
  "pairwise_prompt_version": "blinded-pairwise-v1",
  "sample_seed": "phase5a-dev-20260918",
  "development_sample_size": 200,
  "repeatability_sample_size": 100,
  "repeatability_passes": 3,
  "order_bias_sample_size": 40,
  "evidence_excerpt_characters": 700,
  "cache_directory": "results/generated/judge_cache",
  "bootstrap_samples": 2000,
  "bootstrap_confidence_level": 0.95,
  "pricing": null,
  "providers": {
    "openai": {
      "api_key_env": "OPENAI_API_KEY",
      "base_url_env": "OPENAI_BASE_URL",
      "default_base_url": "https://api.openai.com/v1"
    },
    "groq": {
      "api_key_env": "GROQ_API_KEY",
      "base_url_env": "GROQ_BASE_URL",
      "default_base_url": "https://api.groq.com/openai/v1"
    }
  }
}
